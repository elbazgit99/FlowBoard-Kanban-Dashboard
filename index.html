<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLOWBOARD</title>
  <link rel="stylesheet" href="src/output.css">
  <link style="background: none;" rel="shortcut icon" href="/assets/kanban-log.jpg" type="image/x-icon">
  <!-- <script type="module" src="UI.js" defer></script> -->
  <script type="module" src="API.js" defer></script>
</head>

<body class="bg-[#09090B] col text-white p-12">
  <!-- npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch -->
  <h1 class=" text-1 pb-1 mb-4"><span class="text-amber-700">YouCode</span> Scrum</h1>
  <span id="resetWrapper">
    <!-- <p></p> in js -->
    <!-- <button></button> -->
  </span>
  <main class="grid grid-cols-5 gap-4 ">
    <aside class="p-3 bg-[#18181B] border border-[#27272A] rounded-xl grid  gap-2">
      <span class=" p-2 bg-[#202023] rounded-sm">1</span>
      <span class=" p-2 bg-[#202023] rounded-sm">2</span>
      <span class=" p-2 bg-[#202023] rounded-sm">3</span>
      <span class=" p-2 bg-[#202023] rounded-sm">4</span>
      <span class=" p-2 bg-[#202023] rounded-sm">5</span>
      <span class=" p-2 bg-[#202023] rounded-sm">6</span>
    </aside>

    <section class="col-span-4 grid gap-1 ">
      <h2 class="text-2xl">Flowboard</h2>

      <fieldset class="flex align-middle justify-start gap-x-5">
        <label>
          <input id="searchInput" type="search" placeholder="Filter Board By title"
            class="bg-[#202023]  p-2 w-92 max-w-92 rounded-md " style="border: solid 1px #38383d; ">
        </label>
        <button id="openModal" type="button"
          class="h-10 bg-[#202023]  p-2 rounded-md w-40 border border-white/75">Create Card</button>
      </fieldset>

      <!-- moda -->
    <div id="myModal" class="modal">
        <div id="modalContent" class="modal-content">

            <h2 id="modalTitle" class="modal-title">Create Task</h2>

            <label  class="modal-label">Title
              <input type="text" id="title" class="modal-input"
                  placeholder="Enter task title...">
            </label>

            <label class="modal-label">Description
              <textarea id="description" class="modal-textarea"
                  placeholder="Add a description..."></textarea>
            </label>

            <fieldset id="taskDetails" class="task-details">
                <legend id="detailsLegend" class="details-legend">
                    Task Details
                </legend>

                <div id="detailsRow" class="details-row">

                    <div id="statusItem" class="detail-item">
                        <label class="detail-label">Status
                          <select id="status" class="detail-select">
                              <option value="" selected disabled>Status ...</option>
                              <option value="todo">To Do</option>
                              <option value="in-progress">In Progress</option>
                              <option value="done">Done</option>
                          </select>
                        </label>

                    </div>

                    <div id="priorityItem" class="detail-item">
                        <label class="detail-label">Priority
                          <select id="priority" class="detail-select">
                              <option value="" selected disabled>Priority ...</option>
                              <option value="high">High</option>
                              <option value="medium">Medium</option>
                              <option value="low">Low</option>
                          </select>

                        </label>
                    </div>

                </div>
            </fieldset>

            <div id="modalButtons" class="modal-buttons">
                <button id="addBtn" class="modal-btn">Add</button>
                <button id="HiddBtn" class="modal-btn">hidd</button>
            </div>

        </div>
    </div>
      <!-- end modal -->
      <div id="BoardsContainer" class="grid grid-cols-3 gap-5">

        <!-- TODO -->
        <div id="todo" class="boards  p-3 bg-[#18181B] border border-[#27272A] rounded-xl grid  gap-2">
          <label>
            <select name="todoSelection" id="todoSelection" style="appearance: none; color: rgb(176, 154, 154);"
              class="bg-[#202023]  p-2 w-full rounded-md border border-white/75">
              <option value="" selected disabled>Select Todo ... 　　　　　　　　　　　　▼</option>
            </select>
          </label>
          <h4>To Do</h4>
          <article id="todoElementsWrapper" class="flex flex-col gap-3 p-2 bg-[#202023] rounded-sm">
            <!-- <h6>nothing</h6> -->
          </article>
          <button id="add" type="button" class="modalBtn bg-[#202023]  rounded-md w-full">+</button>
        </div>

        <!-- IN PROGRESS -->
        <div class="boards  p-3 bg-[#18181B] border border-[#27272A] rounded-xl grid  gap-2">
          <label>
            <select id="inProgressSelection" name="inProgress" style="appearance: none; color: rgb(176, 154, 154);"
              class="bg-[#202023]  p-2 w-full rounded-md border border-white/75">
              <option value="" selected disabled>Select In-Progress ... 　　　　　　　　 ▼</option>
            </select>
          </label>

          <h4>In Progress</h4>
          <article id="inProgressElementsWrapper" class="flex flex-col gap-3 p-2 bg-[#202023] rounded-sm">
            <!-- <h6>nothing</h6> -->
          </article>
          <button id="add" type="button" class="modalBtn bg-[#202023]  rounded-md w-full">+</button>
        </div>


        <!-- DONE -->
        <div id="done" class="boards   p-3 bg-[#18181B] border border-[#27272A] rounded-xl grid  gap-2">

          <label>
            <select id="doneSelection" name="doneSelection" style="appearance: none; color: rgb(176, 154, 154);"
              class="bg-[#202023]  p-2 w-full rounded-md border border-b-gray-500">
              <option value="" selected disabled>Select Done ...　　　　　　　　　　　　▼ </option>
            </select>
          </label>

          <h4>Done</h4>
          <article id="doneElementWrapper" class="flex flex-col gap-3 p-2 bg-[#202023] rounded-sm">
            <!-- <h6>nothing</h6> -->
          </article>
          <button id="add" type="button" class="modalBtn bg-[#202023]  rounded-md w-full">+</button>
        </div>



      </div>
    </section>
  </main>


</body>

</html>
